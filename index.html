<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthy Video Player – Calm Desk Companion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .app {
            width: 94vw;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        :fullscreen { background: #090d16; padding: 10px; }
        :fullscreen .app { width: 100%; max-width: 100%; height: 100%; }
        :fullscreen .player { flex: 1; height: auto !important; }
        .app.mobile-fs {
            position: fixed;
            inset: 0;
            width: 100%;
            max-width: 100%;
            height: 100%;
            z-index: 9999;
            background: #090d16;
            padding: 8px;
        }
        .app.mobile-fs .player { flex: 1; height: auto; }
        .app.desk-mode .bar,
        .app.desk-mode .controls-toggle,
        .app.desk-mode .controls-panel { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .app.desk-mode.show-controls .bar,
        .app.desk-mode.show-controls .controls-toggle,
        .app.desk-mode.show-controls .controls-panel { opacity: 1; pointer-events: auto; }

        .controls-toggle {
            align-self: flex-start;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .controls-panel { display: none; flex-direction: column; gap: 8px; }
        .controls-panel.open { display: flex; }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid #334155;
            gap: 8px;
            flex-wrap: wrap;
        }
        .group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        label { font-size: 10px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        select, input[type="file"], input[type="text"], input[type="number"] {
            background: #0f172a; color: #fff; border: 1px solid #475569;
            border-radius: 4px; padding: 3px 6px; font-size: 12px;
        }
        .player {
            position: relative;
            width: 100%;
            height: 50vh;
            min-height: 280px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .slide {
            position: absolute; inset: 0; opacity: 0;
            transition: opacity 1.3s ease; z-index: 1;
        }
        .slide.active { opacity: 1; z-index: 2; }
        .slide video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
        }
        .caption {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(15,23,42,0.9); padding: 5px 10px;
            border-radius: 4px; font-size: 12px; border: 1px solid #334155; z-index: 3;
        }
        .placeholder {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 14px; text-align: center; padding: 20px;
        }
        button {
            background: #334155; border: 1px solid #64748b; color: #fff;
            padding: 5px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        button.primary { background: #0284c7; border-color: #38bdf8; }
        button.small { padding: 3px 6px; font-size: 11px; }
        .counter, .status { font-size: 12px; color: #94a3b8; }
        .timer-status { color: #38bdf8; font-weight: 600; }
        .suggestions { font-size: 11px; color: #64748b; }
        .suggestions button { margin: 0 2px; padding: 2px 5px; font-size: 10px; }
        .storage-info { font-size: 11px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <button class="controls-toggle" id="controlsToggle">Controls ▾</button>
    <div class="controls-panel" id="controlsPanel">
        <div class="bar">
            <div class="group">
                <label>Audio</label>
                <input type="file" id="audioFile" accept="audio/*">
                <button id="clearAudio" class="small">Clear audio</button>
            </div>
            <div class="group">
                <label>Category</label>
                <select id="category"></select>
                <button id="clearCat" class="small">Clear</button>
            </div>
            <div class="status" id="status">Loading…</div>
        </div>
        <div class="bar">
            <div class="group">
                <label>Add videos</label>
                <input type="file" id="videoFiles" accept="video/*" multiple>
                <input type="text" id="newCatName" placeholder="Category name" style="width:120px">
                <button id="addVideos" class="primary small">Add to category</button>
            </div>
            <div class="group">
                <label>Desk</label>
                <button id="deskMode" class="small">Desk Mode</button>
                <button id="aiPrompt" class="small">AI Prompt</button>
            </div>
            <div class="group">
                <label>Break timer</label>
                <input type="number" id="timerMins" min="1" max="120" value="25" style="width:50px">
                <button id="startTimer" class="small">Start</button>
                <span class="timer-status" id="timerStatus"></span>
            </div>
            <div class="group">
                <label>Bundle</label>
                <input type="text" id="bundleCode" placeholder="Access code" style="width:100px">
                <button id="unlockBundle" class="small">Unlock</button>
            </div>
        </div>
        <div class="suggestions" id="suggestions">Quick categories:</div>
        <div class="storage-info" id="storageInfo">Checking storage…</div>
    </div>

    <div class="player" id="player">
        <div class="placeholder" id="placeholder">Add videos or unlock a bundle (try NATURE-CORE)</div>
    </div>

    <div class="bar">
        <div class="group">
            <button id="prev">❮</button>
            <button id="play" class="primary">Pause</button>
            <button id="next">❯</button>
            <button id="mute" title="Toggle video sound">🔇</button>
        </div>
        <div class="group">
            <button id="fs">⛶</button>
            <span class="counter" id="counter">Clip 0 of 0</span>
        </div>
    </div>
</div>
<audio id="audio" loop></audio>

<script>
let slidesData = {};
let personalData = {};
let unlockedBundles = {};
let category = "";
let index = 0;
let timer = null;
let playing = true;
let muted = false;
let videoMuted = true;
let duration = 8000;
let deskMode = false;
let hideTimeout = null;
let wakeLock = null;
let breakTimer = null;
let breakEnd = null;
let controlsOpen = false;
const objectUrls = new Set();

const player = document.getElementById("player");
const catSelect = document.getElementById("category");
const playBtn = document.getElementById("play");
const counter = document.getElementById("counter");
const statusEl = document.getElementById("status");
const audio = document.getElementById("audio");
const muteBtn = document.getElementById("mute");
const app = document.getElementById("app");
const controlsToggle = document.getElementById("controlsToggle");
const controlsPanel = document.getElementById("controlsPanel");
const storageInfo = document.getElementById("storageInfo");
const placeholder = document.getElementById("placeholder");

const DB_NAME = "EarthyVideoPlayerDB";
const STORE_NAME = "personalClips";

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
    });
}
async function loadPersonal() {
    try {
        const db = await openDB();
        return new Promise(r => {
            const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).get("data");
            req.onsuccess = () => r(req.result || {});
            req.onerror = () => r({});
        });
    } catch { return {}; }
}
async function savePersonal(data) {
    try {
        const db = await openDB();
        db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(data, "data");
    } catch (e) { console.warn(e); }
}
async function loadUnlocked() {
    try {
        const db = await openDB();
        return new Promise(r => {
            const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).get("unlocked");
            req.onsuccess = () => r(req.result || {});
            req.onerror = () => r({});
        });
    } catch { return {}; }
}
async function saveUnlocked(data) {
    try {
        const db = await openDB();
        db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(data, "unlocked");
    } catch (e) { console.warn(e); }
}
async function saveAudio(blob) {
    try {
        const db = await openDB();
        db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(blob, "audio");
    } catch (e) { console.warn(e); }
}
async function loadAudio() {
    try {
        const db = await openDB();
        return new Promise(r => {
            const req = db.transaction(STORE_NAME).objectStore(STORE_NAME).get("audio");
            req.onsuccess = () => r(req.result || null);
            req.onerror = () => r(null);
        });
    } catch { return null; }
}
async function clearAudio() {
    try {
        const db = await openDB();
        db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).delete("audio");
    } catch (e) { console.warn(e); }
}

const BUNDLES = {
    "NATURE-CORE": {
        name: "Nature Calm – Core",
        slides: [
            { url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4", caption: "Flower – calm loop" },
            { url: "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4", caption: "Bunny short clip" }
        ]
    },
    "TEST-CLIPS": {
        name: "Test Clips – Sample",
        slides: [
            { url: "https://cdn.truefilesize.com/mp4/sample-1mb.mp4", caption: "Sample 4s clip" },
            { url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4", caption: "Flower again" }
        ]
    }
};

async function updateStorageInfo() {
    if (!navigator.storage?.estimate) { storageInfo.textContent = "Storage info not available"; return; }
    try {
        const e = await navigator.storage.estimate();
        const used = (e.usage / 1024 / 1024).toFixed(1);
        const quota = e.quota ? (e.quota / 1024 / 1024).toFixed(0) : "unknown";
        storageInfo.textContent = `Storage: ${used} MB used of ~${quota} MB`;
    } catch { storageInfo.textContent = "Could not read storage"; }
}

function updateQuickCategories() {
    const c = document.getElementById("suggestions");
    c.innerHTML = "Quick categories: ";
    const keys = Object.keys(slidesData).filter(k => k !== "demo").sort();
    if (!keys.length) { c.innerHTML += `<span style="opacity:.6">(none yet)</span>`; return; }
    keys.forEach(key => {
        const b = document.createElement("button");
        b.className = "small";
        b.textContent = key.charAt(0).toUpperCase() + key.slice(1);
        b.onclick = () => { document.getElementById("newCatName").value = key; document.getElementById("newCatName").focus(); };
        c.appendChild(b);
    });
}

function revokeObjectUrls() {
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls.clear();
}

async function loadJSON() {
    try {
        const res = await fetch("videos.json");
        if (!res.ok) throw 0;
        slidesData = await res.json();
        statusEl.textContent = "Loaded defaults";
    } catch {
        statusEl.textContent = "No videos.json – using personal + unlocked";
        slidesData = {};
    }
    personalData = await loadPersonal();
    unlockedBundles = await loadUnlocked();
    applyUnlockedBundles();
    mergeData();
    loadCategories();
    const saved = await loadAudio();
    if (saved) {
        const u = URL.createObjectURL(saved);
        objectUrls.add(u);
        audio.src = u;
        audio.muted = muted;
        audio.play().catch(() => {});
    }
    updateStorageInfo();
}

function applyUnlockedBundles() {
    for (const code of Object.keys(unlockedBundles)) {
        const b = BUNDLES[code];
        if (b && !slidesData[b.name]) slidesData[b.name] = b.slides;
    }
}

function mergeData() {
    revokeObjectUrls();
    for (const [cat, items] of Object.entries(personalData)) {
        if (!slidesData[cat]) slidesData[cat] = [];
        const existing = new Set(slidesData[cat].map(i => i.caption));
        items.forEach(item => {
            if (item.blob && !existing.has(item.caption)) {
                const u = URL.createObjectURL(item.blob);
                objectUrls.add(u);
                slidesData[cat].push({ url: u, caption: item.caption });
            }
        });
    }
}

function loadCategories() {
    catSelect.innerHTML = "";
    const keys = Object.keys(slidesData).sort();
    if (!keys.length) {
        slidesData.demo = [{ url: "", caption: "Add your videos or unlock a bundle" }];
        keys.push("demo");
    }
    keys.forEach(k => {
        const o = document.createElement("option");
        o.value = k; o.textContent = k.charAt(0).toUpperCase() + k.slice(1);
        catSelect.appendChild(o);
    });
    if (!category || !keys.includes(category)) category = keys[0];
    catSelect.value = category;
    build();
    updateQuickCategories();
}

function build() {
    player.querySelectorAll(".slide").forEach(s => s.remove());
    index = 0;
    const items = slidesData[category] || [];
    if (!items.length || (items.length === 1 && !items[0].url)) {
        placeholder.style.display = "flex";
        placeholder.textContent = "No videos yet — add some or unlock NATURE-CORE";
        updateCounter();
        return;
    }
    placeholder.style.display = "none";
    items.forEach(item => {
        if (!item.url) return;
        const slide = document.createElement("div");
        slide.className = "slide";
        const video = document.createElement("video");
        video.src = item.url;
        video.muted = true;
        video.playsInline = true;
        video.loop = true;
        video.preload = "auto";
        video.onerror = () => { video.style.opacity = "0.3"; console.warn("Video failed:", item.url); };
        slide.appendChild(video);
        if (item.caption) {
            const cap = document.createElement("div");
            cap.className = "caption";
            cap.textContent = item.caption;
            slide.appendChild(cap);
        }
        player.appendChild(slide);
    });
    const slides = player.querySelectorAll(".slide");
    if (slides.length) show(0, true);
    else {
        placeholder.style.display = "flex";
        placeholder.textContent = "Videos failed to load — try adding your own";
    }
    updateCounter();
    start();
}

function pauseAllVideos() {
    player.querySelectorAll("video").forEach(v => v.pause());
}

function show(i, init = false) {
    const slides = player.querySelectorAll(".slide");
    if (!slides.length) return;
    const prev = slides[index];
    if (prev && !init) {
        const v = prev.querySelector("video");
        if (v) v.pause();
        prev.classList.remove("active");
    }
    index = (i + slides.length) % slides.length;
    const next = slides[index];
    next.className = "slide active";
    const video = next.querySelector("video");
    if (video) {
        video.muted = videoMuted;
        video.currentTime = 0;
        video.play().catch(() => {});
    }
    updateCounter();
}

function next() { show(index + 1); }
function prev() { show(index - 1); }
function updateCounter() {
    const len = player.querySelectorAll(".slide").length;
    counter.textContent = `Clip ${len ? index + 1 : 0} of ${len}`;
}
function start() {
    clearInterval(timer);
    if (playing && player.querySelectorAll(".slide").length > 1) {
        timer = setInterval(next, duration);
    }
}
function togglePlay() {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.classList.toggle("primary", playing);
    if (!playing) pauseAllVideos();
    else {
        const a = player.querySelector(".slide.active video");
        if (a) a.play().catch(() => {});
    }
    start();
}

controlsToggle.onclick = () => {
    controlsOpen = !controlsOpen;
    controlsPanel.classList.toggle("open", controlsOpen);
    controlsToggle.textContent = controlsOpen ? "Controls ▴" : "Controls ▾";
    if (controlsOpen) updateStorageInfo();
};

document.getElementById("addVideos").onclick = async () => {
    const files = document.getElementById("videoFiles").files;
    let catName = document.getElementById("newCatName").value.trim() || category || "personal";
    if (!files.length) { statusEl.textContent = "Select videos first"; return; }
    if (!personalData[catName]) personalData[catName] = [];
    statusEl.textContent = `Adding ${files.length} video(s)…`;
    for (const file of files) {
        personalData[catName].push({ blob: file, caption: file.name.replace(/\.[^.]+$/, "") });
    }
    await savePersonal(personalData);
    mergeData();
    loadCategories();
    category = catName;
    catSelect.value = category;
    build();
    statusEl.textContent = `Added to "${catName}"`;
    document.getElementById("videoFiles").value = "";
    document.getElementById("newCatName").value = "";
    updateStorageInfo();
    updateQuickCategories();
};

document.getElementById("clearCat").onclick = async () => {
    if (!confirm(`Clear personal videos from "${category}"?`)) return;
    if (personalData[category]) {
        delete personalData[category];
        await savePersonal(personalData);
        location.reload();
    }
};

document.getElementById("unlockBundle").onclick = async () => {
    const code = document.getElementById("bundleCode").value.trim().toUpperCase();
    if (!code) return;
    const bundle = BUNDLES[code];
    if (!bundle) { statusEl.textContent = "Invalid code"; return; }
    unlockedBundles[code] = true;
    await saveUnlocked(unlockedBundles);
    applyUnlockedBundles();
    mergeData();
    loadCategories();
    category = bundle.name;
    catSelect.value = category;
    build();
    statusEl.textContent = `Unlocked: ${bundle.name}`;
    document.getElementById("bundleCode").value = "";
};

document.getElementById("deskMode").onclick = async () => {
    deskMode = !deskMode;
    app.classList.toggle("desk-mode", deskMode);
    document.getElementById("deskMode").textContent = deskMode ? "Exit Desk" : "Desk Mode";
    if (deskMode) {
        controlsOpen = false;
        controlsPanel.classList.remove("open");
        controlsToggle.textContent = "Controls ▾";
        if (navigator.wakeLock) {
            try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
        }
        scheduleHide();
        if (document.fullscreenEnabled && !document.fullscreenElement) {
            app.requestFullscreen().catch(() => app.classList.add("mobile-fs"));
        } else app.classList.add("mobile-fs");
    } else {
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        clearTimeout(hideTimeout);
        app.classList.remove("show-controls", "mobile-fs");
    }
};

function scheduleHide() {
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => { if (deskMode) app.classList.remove("show-controls"); }, 5000);
}
function showControls() {
    if (!deskMode) return;
    app.classList.add("show-controls");
    scheduleHide();
}
["mousemove", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, showControls));

document.getElementById("aiPrompt").onclick = () => {
    const idea = prompt("Describe the scene:", "peaceful tropical beach at golden hour");
    if (!idea) return;
    const t = `Cinematic, photorealistic video, highly detailed, serene ${idea}, soft natural lighting, calm atmosphere, slow gentle movement, no people, no text, no logos, high quality, tranquil mood`;
    navigator.clipboard.writeText(t).then(() => {
        statusEl.textContent = "AI prompt copied";
        setTimeout(() => statusEl.textContent = "", 3000);
    }).catch(() => alert(t));
};

document.getElementById("startTimer").onclick = () => {
    const mins = parseInt(document.getElementById("timerMins").value) || 25;
    if (breakTimer) {
        clearInterval(breakTimer); breakTimer = null;
        document.getElementById("timerStatus").textContent = "";
        document.getElementById("startTimer").textContent = "Start";
        return;
    }
    breakEnd = Date.now() + mins * 60000;
    document.getElementById("startTimer").textContent = "Stop";
    updateTimerDisplay();
    breakTimer = setInterval(updateTimerDisplay, 1000);
};
function updateTimerDisplay() {
    if (!breakEnd) return;
    const left = Math.max(0, breakEnd - Date.now());
    if (left <= 0) {
        clearInterval(breakTimer); breakTimer = null;
        document.getElementById("timerStatus").textContent = "Break time!";
        document.getElementById("startTimer").textContent = "Start";
        player.style.outline = "4px solid #38bdf8";
        setTimeout(() => player.style.outline = "", 3000);
        return;
    }
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    document.getElementById("timerStatus").textContent = `${m}:${s.toString().padStart(2, "0")}`;
}

catSelect.onchange = e => { category = e.target.value; build(); };
document.getElementById("next").onclick = () => { next(); start(); };
document.getElementById("prev").onclick = () => { prev(); start(); };
playBtn.onclick = togglePlay;
document.getElementById("fs").onclick = () => {
    if (document.fullscreenEnabled && !document.fullscreenElement) {
        app.requestFullscreen().catch(() => app.classList.toggle("mobile-fs"));
    } else if (document.fullscreenElement) {
        document.exitFullscreen();
    } else app.classList.toggle("mobile-fs");
};

document.getElementById("audioFile").onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const u = URL.createObjectURL(file);
    objectUrls.add(u);
    audio.src = u;
    audio.muted = muted;
    audio.play().catch(() => {});
    await saveAudio(file);
    statusEl.textContent = "Audio saved";
    updateStorageInfo();
};
document.getElementById("clearAudio").onclick = async () => {
    audio.src = "";
    await clearAudio();
    statusEl.textContent = "Audio cleared";
    updateStorageInfo();
};

muteBtn.onclick = () => {
    videoMuted = !videoMuted;
    muteBtn.textContent = videoMuted ? "🔇" : "🔊";
    player.querySelectorAll("video").forEach(v => { v.muted = videoMuted; });
    if (!videoMuted) {
        audio.muted = true;
        const active = player.querySelector(".slide.active video");
        if (active) {
            active.muted = false;
            active.volume = 1;
            active.play().catch(() => {});
        }
        statusEl.textContent = "Video sound on";
    } else {
        audio.muted = muted;
        statusEl.textContent = "Video sound muted";
    }
    setTimeout(() => { if (statusEl.textContent.includes("sound")) statusEl.textContent = ""; }, 2000);
};

document.addEventListener("keydown", e => {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
    if (e.code === "ArrowRight") { next(); start(); }
    if (e.code === "ArrowLeft") { prev(); start(); }
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    if (e.code === "KeyM") muteBtn.click();
    if (e.code === "KeyF") document.getElementById("fs").click();
    if (e.code === "KeyD") document.getElementById("deskMode").click();
});

document.addEventListener("visibilitychange", () => {
    if (deskMode && document.visibilityState === "visible" && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(l => wakeLock = l).catch(() => {});
    }
});

loadJSON();
</script>
</body>
</html>
