<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthy Video Player – Calm Desk Companion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .app {
            width: 94vw;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.4s ease;
        }
        :fullscreen { background: #090d16; padding: 10px; }
        :fullscreen .app { width: 100%; max-width: 100%; height: 100%; }
        :fullscreen .player { flex: 1; height: auto !important; }
        .app.mobile-fs {
            position: fixed;
            inset: 0;
            width: 100%;
            max-width: 100%;
            height: 100%;
            z-index: 9999;
            background: #090d16;
            padding: 8px;
        }
        .app.mobile-fs .player { flex: 1; height: auto; }
        .app.desk-mode .bar,
        .app.desk-mode .controls-toggle,
        .app.desk-mode .controls-panel { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .app.desk-mode.show-controls .bar,
        .app.desk-mode.show-controls .controls-toggle,
        .app.desk-mode.show-controls .controls-panel { opacity: 1; pointer-events: auto; }

        .controls-toggle {
            align-self: flex-start;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .controls-toggle:hover { background: #334155; }
        .controls-panel {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .controls-panel.open { display: flex; }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid #334155;
            gap: 8px;
            flex-wrap: wrap;
        }
        .group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        label {
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        select, input[type="file"], input[type="range"], input[type="text"], input[type="number"] {
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
        }
        input[type="range"] { width: 70px; height: 4px; accent-color: #0284c7; padding: 0; }
        .val { font-size: 11px; color: #38bdf8; min-width: 26px; }
        input[type="file"]::file-selector-button {
            background: #334155;
            color: #fff;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 11px;
            margin-right: 4px;
        }
        .player {
            position: relative;
            width: 100%;
            height: 540px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.3s ease;
            z-index: 1;
        }
        .slide.active { opacity: 1; z-index: 2; }
        .slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1);
            will-change: transform;
            background: #000;
        }
        .caption {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15,23,42,0.9);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #334155;
            z-index: 3;
        }
        button {
            background: #334155;
            border: 1px solid #64748b;
            color: #fff;
            padding: 5px 9px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #475569; }
        button.primary { background: #0284c7; border-color: #38bdf8; }
        button.primary:hover { background: #0369a1; }
        button.small { padding: 3px 6px; font-size: 11px; }
        .counter, .status { font-size: 12px; color: #94a3b8; }
        .timer-status { color: #38bdf8; font-weight: 600; }
        .suggestions { font-size: 11px; color: #64748b; }
        .suggestions button { margin: 0 2px; padding: 2px 5px; font-size: 10px; }
        .storage-info { font-size: 11px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
<div class="app" id="app">
    <button class="controls-toggle" id="controlsToggle">Controls ▾</button>
    <div class="controls-panel" id="controlsPanel">
        <div class="bar">
            <div class="group">
                <label>Audio</label>
                <input type="file" id="audioFile" accept="audio/*">
                <button id="clearAudio" class="small">Clear audio</button>
            </div>
            <div class="group">
                <label>Category</label>
                <select id="category"></select>
                <button id="clearCat" class="small" title="Clear personal videos in this category">Clear</button>
            </div>
            <div class="status" id="status">Loading…</div>
        </div>

        <div class="bar">
            <div class="group">
                <label>Add videos</label>
                <input type="file" id="videoFiles" accept="video/*" multiple>
                <input type="text" id="newCatName" placeholder="Category name" style="width:120px">
                <button id="addVideos" class="primary small">Add to category</button>
            </div>
            <div class="group">
                <label>Desk</label>
                <button id="deskMode" class="small">Desk Mode</button>
                <button id="aiPrompt" class="small" title="Copy AI video prompt">AI Prompt</button>
            </div>
            <div class="group">
                <label>Break timer</label>
                <input type="number" id="timerMins" min="1" max="120" value="25" style="width:50px">
                <button id="startTimer" class="small">Start</button>
                <span class="timer-status" id="timerStatus"></span>
            </div>
            <div class="group">
                <label>Bundle</label>
                <input type="text" id="bundleCode" placeholder="Access code" style="width:100px">
                <button id="unlockBundle" class="small">Unlock</button>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            Quick categories:
        </div>
        <div class="storage-info" id="storageInfo">Checking storage…</div>
    </div>

    <div class="player" id="player"></div>

    <div class="bar">
        <div class="group">
            <button id="prev">❮</button>
            <button id="play" class="primary">Pause</button>
            <button id="next">❯</button>
            <button id="mute" title="Toggle video sound">🔇</button>
        </div>
        <div class="group">
            <button id="fs">⛶</button>
            <span class="counter" id="counter">Clip 0 of 0</span>
        </div>
    </div>
</div>
<audio id="audio" loop></audio>

<script>
let slidesData = {};
let personalData = {};
let unlockedBundles = {};
let category = "";
let index = 0;
let timer = null;
let playing = true;
let muted = false;
let videoMuted = true; // start muted for autoplay; click mute button to enable video sound
let duration = 8000; // fixed clip length in ms
let deskMode = false;
let hideTimeout = null;
let wakeLock = null;
let breakTimer = null;
let breakEnd = null;
let controlsOpen = false;
const objectUrls = new Set();

const player = document.getElementById("player");
const catSelect = document.getElementById("category");
const playBtn = document.getElementById("play");
const counter = document.getElementById("counter");
const statusEl = document.getElementById("status");
const audio = document.getElementById("audio");
const muteBtn = document.getElementById("mute");
const app = document.getElementById("app");
const controlsToggle = document.getElementById("controlsToggle");
const controlsPanel = document.getElementById("controlsPanel");
const storageInfo = document.getElementById("storageInfo");

// IndexedDB setup
const DB_NAME = "EarthyVideoPlayerDB";
const STORE_NAME = "personalClips";

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
    });
}

async function loadPersonal() {
    try {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const req = store.get("data");
            req.onsuccess = () => resolve(req.result || {});
            req.onerror = () => resolve({});
        });
    } catch {
        return {};
    }
}

        const store = tx.objectStore(STORE_NAME);

    } catch (e) {
